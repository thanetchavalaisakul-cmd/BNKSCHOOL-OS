name: BNK natural sorting for project and activity IDs
on:
  push:
    branches: [fix/project-natural-sort-20261030]
permissions:
  contents: write
concurrency:
  group: bnk-natural-project-sort
  cancel-in-progress: false
jobs:
  build-and-commit:
    if: "!contains(github.event.head_commit.message, '[project-sort-built]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply narrow, reviewed UI sort patch
        run: python3 changes/project-natural-sort-20261030.py
      - name: Verify full application and build
        run: |
          npm ci --no-audit --no-fund
          npm run verify
          git diff --check
      - name: Commit validated UI and optimized bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.min.js index.html
          git commit -m "fix: sort project and activity codes numerically [project-sort-built]"
          git push origin HEAD:fix/project-natural-sort-20261030
