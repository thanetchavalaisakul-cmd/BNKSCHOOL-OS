name: BNK DMC transfer-only validation and bundle build

on:
  push:
    branches:
      - fix/dmc-transfer-only-exclusion-20261111
    paths:
      - .github/workflows/dmc-transfer-only-build.yml
      - app.js
      - app.min.js
      - index.html
      - tests/student-transfer-authority-20261111.test.mjs
      - supabase/migrations/20261111000245_student_transfer_authority_and_dmc_import_guard.sql
      - supabase/migrations/20261111000421_dmc_transfer_out_requires_transfer_workflow.sql
      - supabase/migrations/20261111001627_limit_dmc_skip_to_confirmed_transfer_out.sql
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout DMC transfer-only branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/dmc-transfer-only-exclusion-20261111
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source, build bundle, and run regressions
        run: |
          node --check app.js
          npm run verify
          git diff --check
      - name: Commit refreshed production bundle
        run: |
          if git diff --quiet -- app.min.js; then
            echo "app.min.js is already up to date"
          else
            git config user.name "BNK School OS Build"
            git config user.email "bnk-school-os-build@users.noreply.github.com"
            git add app.min.js
            git commit -m "build: refresh DMC transfer-only bundle"
            git push origin HEAD:fix/dmc-transfer-only-exclusion-20261111
          fi
