name: Apply tested PA evaluator four signature methods v47
on:
  push:
    branches: [main]
    paths: [.github/workflows/pa-signature-v47-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: "github.event.head_commit.message == 'ci: apply verified PA signatures v47'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 5
          persist-credentials: true
      - name: Confirm source and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~4)" = "e8d332de6698c4b361d72ad292c75992ef12c229"
          cat .tmp/bnk-v47.part-*.b64 | base64 --decode | gzip --decompress > /tmp/bnk-v47.patch
          echo "da20d2509f95e36331c8850b90583defb1feb410a137843b2d793bb191cc7578  /tmp/bnk-v47.patch" | sha256sum --check
          git apply --check /tmp/bnk-v47.patch
          git apply /tmp/bnk-v47.patch
      - name: Test all regression cases
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          git diff --check
      - name: Publish tested release and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pa-signature-v47-once.yml .tmp/bnk-v47.part-*.b64
          git add app.js app.min.js index.html
          git add tests/pa-four-signature-modes.test.mjs supabase-pa-evaluator-four-method-20261030.sql
          git add -u .github/workflows/pa-signature-v47-once.yml .tmp
          git diff --cached --check
          git -c user.name="BNK School OS CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: evaluator PA2 accepts four signature methods including paper"
          git push origin HEAD:main
