name: BNK Demo Teachers Release
on:
  push:
    branches: [main]
    paths:
      - .github/demo-teachers-release.patch.gz.b64
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply demo teacher directory update
        run: |
          python3 - <<'PY'
          import pathlib,base64,gzip
          b=pathlib.Path('.github/demo-teachers-release.patch.gz.b64').read_text().strip()
          pathlib.Path('/tmp/demo-teachers.patch').write_bytes(gzip.decompress(base64.b64decode(b,validate=True)))
          PY
          git apply --check /tmp/demo-teachers.patch
          git apply --index /tmp/demo-teachers.patch
      - name: Verify syntax and timetable tests
        run: |
          node --check app.js
          node --check timetable-constraints.js
          node --test tests/performance-regression.test.mjs tests/timetable-constraints.test.mjs tests/timetable-condition-periods.test.mjs
          git diff --cached --check
      - name: Commit and publish
        run: |
          git config user.name "BNK School OS Release Bot"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "feat: show three non-login demo teachers in timetable sandbox"
          git push origin HEAD:main
