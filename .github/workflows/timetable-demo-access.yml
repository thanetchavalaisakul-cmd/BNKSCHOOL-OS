name: BNK Demo Room Access Release
on:
  push:
    branches: [main]
    paths: [.github/timetable-demo-access.patch.gz.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply class-scoped demo management patch
        run: |
          python3 - <<'PY'
          import gzip,base64,pathlib
          source=pathlib.Path('.github/timetable-demo-access.patch.gz.b64').read_text().strip()
          pathlib.Path('/tmp/demo-patch').write_bytes(gzip.decompress(base64.b64decode(source,validate=True)))
          PY
          git apply --check /tmp/demo-patch
          git apply --index /tmp/demo-patch
      - name: Check app and tests
        run: |
          node --check app.js
          node --test tests/performance-regression.test.mjs tests/timetable-constraints.test.mjs tests/timetable-condition-periods.test.mjs
      - name: Publish the update
        run: |
          git config user.name "BNK School OS Release Bot"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "feat: support classroom-scoped demo timetable editing"
          git push origin HEAD:main
