name: BNK Performance Phase 4 Release
on:
  push:
    branches: [main]
    paths: ['.github/phase4-performance-payload.txt']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed image extraction and performance patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          p=Path('app.js')
          s=p.read_text()
          old='// Embed the supplied Garuda image so official PDFs do not depend on an asset path.'
          new='// Use the exact same-origin PNG asset rather than parsing its large base64 string at startup.'
          assert s.count(old)==1
          s=s.replace(old,new)
          s,n=re.subn(r'const ACADEMIC_REG_GARUDA_DATA_URL = "data:image/png;base64,[^"]+";', 'const ACADEMIC_REG_GARUDA_DATA_URL = new URL("./garuda-official.png", import.meta.url).href;',s)
          assert n==1
          p.write_text(s)
          payload=Path('.github/phase4-performance-payload.txt').read_text().strip()
          Path('/tmp/phase4-performance.patch').write_bytes(gzip.decompress(base64.b64decode(payload,validate=True)))
          PY
          git add app.js
          git apply --check /tmp/phase4-performance.patch
          git apply --index /tmp/phase4-performance.patch
          git add app.js
      - name: Verify all school modules
        run: |
          node --check app.js
          node --test tests/*.test.mjs
          git diff --cached --check
      - name: Publish verified performance improvements
        run: |
          git config user.name "BNK School OS Release"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "perf: lazy-load spreadsheets and procurement master, reduce startup image data"
          git push origin HEAD:main
