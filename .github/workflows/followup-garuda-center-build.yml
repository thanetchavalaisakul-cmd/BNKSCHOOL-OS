name: Verify and build centered follow-up Garuda
on:
  push:
    branches: [fix/followup-garuda-page-center-20261119]
permissions:
  contents: write
concurrency:
  group: bnk-followup-garuda-20261119
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/followup-garuda-page-center-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install exact pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Garuda layout changes and regressions
        run: |
          node --check app.js
          npm run verify
          git diff --check
      - name: Persist rebuilt production bundle
        run: |
          git add app.min.js
          if ! git diff --cached --quiet; then
            git config user.name "BNK School OS Build"
            git config user.email "bnk-school-os-build@users.noreply.github.com"
            git commit -m "build: refresh centered Garuda PDF bundle"
            git push origin HEAD:fix/followup-garuda-page-center-20261119
          fi
