name: BNK All-day Substitute - verified build
on:
  push:
    branches: [feat/all-day-substitute-20261030]
permissions:
  contents: write
concurrency:
  group: bnk-all-day-substitute
  cancel-in-progress: false
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[all-day-built]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Expand reviewed source and migration
        run: |
          base64 --decode changes/substitute-all-day-app.patch.gz.b64 | gzip --decompress > changes/substitute-all-day-app.patch
          base64 --decode changes/substitute-all-day-sql.sql.gz.b64 | gzip --decompress > supabase-substitute-all-day-20261030.sql
          git apply --check changes/substitute-all-day-app.patch
          git apply changes/substitute-all-day-app.patch
      - name: Install pinned build dependency
        run: npm ci
      - name: Validate build and all regression tests
        run: npm run verify
      - name: Commit verified code, bundle and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.min.js supabase-substitute-all-day-20261030.sql
          git commit -m "feat: atomic all-day substitute mode with one-time signatures [all-day-built]"
          git push origin HEAD:feat/all-day-substitute-20261030
