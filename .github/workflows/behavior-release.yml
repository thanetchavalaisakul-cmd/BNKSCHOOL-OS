name: Apply BNK Student Behavior Release
on:
  push:
    branches: [main]
    paths:
      - .github/behavior-release.patch.gz.b64
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bnk-student-behavior-release
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed module patch
        run: |
          python3 - <<'PY'
          import base64,gzip,pathlib
          payload=pathlib.Path('.github/behavior-release.patch.gz.b64').read_text().strip()
          pathlib.Path('/tmp/student-behavior.patch').write_bytes(gzip.decompress(base64.b64decode(payload,validate=True)))
          PY
          git apply --check /tmp/student-behavior.patch
          git apply --index /tmp/student-behavior.patch
      - name: JavaScript and regression checks
        run: |
          node --check app.js
          node --check behavior.js
          node --test tests/performance-regression.test.mjs
          git diff --cached --check
      - name: Commit and push verified module
        run: |
          git config user.name "BNK School OS Release Bot"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "feat: integrate student behavior module into general administration"
          git push origin HEAD:main
