name: Apply tested academic and lesson plan signatures v46
on:
  push:
    branches: [main]
    paths: [.github/workflows/signature-academic-v46-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: "github.event.head_commit.message == 'ci: apply verified academic signing v46'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 11
          persist-credentials: true
      - name: Check base SHA and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~10)" = "0b78d04ff62d974a67ce64bcf5f3555431655c09"
          cat .tmp/bnk-v46.part-*.b64 | base64 --decode | gzip --decompress > /tmp/bnk-v46.patch
          echo "ac426536225c5ced98815d834e769d076892413583e7dc1bbc619c24241ffd55  /tmp/bnk-v46.patch" | sha256sum --check
          git apply --check /tmp/bnk-v46.patch
          git apply /tmp/bnk-v46.patch
      - name: Run production build and 116 regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          git diff --check
      - name: Commit verified app, tests, and migration source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/signature-academic-v46-once.yml .tmp/bnk-v46.part-*.b64
          git add app.js app.min.js index.html
          git add supabase-lesson-plan-signed-20261030.sql supabase-academic-stored-signature-20261030.sql
          git add tests/academic-stored-six-systems.test.mjs tests/lesson-plan-signed-4methods.test.mjs
          git add -u .github/workflows/signature-academic-v46-once.yml .tmp
          git diff --cached --check
          git -c user.name="BNK School OS CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: four method signatures for lesson plans and six academic systems"
          git push origin HEAD:main
