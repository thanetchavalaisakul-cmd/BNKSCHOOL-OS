name: Inspect leave module integration points (feature branch)
on:
  push:
    branches: [feature/official-duty-leave-substitute-20261123]
    paths: ['.github/workflows/official-duty-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/official-duty-leave-substitute-20261123
      - name: Extract existing leave code context for safe patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text(encoding='utf8')
          keys=['function renderLeave','function leave','function saveLeave','async function submitLeave','leave_type_code','leaveTypes','leave_types','leave_days','leaveQuota','leaveRequestForm','leaveForm','data-leave','leaveDailyScheduleLabel','substitute_lessons','renderSubstitute']
          out=['## app.js size %d bytes / %d lines' % (len(app),len(app.splitlines()))]
          for key in keys:
              pos=[m.start() for m in re.finditer(re.escape(key),app)]
              out.append('\n### '+key+' occurrences='+str(len(pos)))
              for x in pos[:35]:
                  l=app.count('\n',0,x)+1
                  out.append('\n--- line '+str(l)+' ---\n'+app[max(0,x-450):min(len(app),x+900)])
          Path('changes/official-duty-inspection.txt').write_text('\n'.join(out)[:800000],encoding='utf8')
          Path('changes/official-duty-leave-section.txt').write_text(''.join(app.splitlines(keepends=True)[4400:5730]),encoding='utf8')
          PY
      - name: Save extracted non-secret code context to branch
        run: |
          git config user.name "BNK Feature Inspector"
          git config user.email "bnk-feature-inspector@users.noreply.github.com"
          git add changes/official-duty-inspection.txt changes/official-duty-leave-section.txt
          git commit -m "chore: inspect existing leave integration points"
          git push origin HEAD:feature/official-duty-leave-substitute-20261123
