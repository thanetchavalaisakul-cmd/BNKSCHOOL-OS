name: BNK payment evidence transfer-out roster filter

on:
  push:
    branches:
      - fix/payment-evidence-exclude-transferred-out-20261111
    paths:
      - .github/workflows/payment-evidence-transfer-filter-build.yml
      - app.js
      - index.html
      - modules/payment-evidence-documents.js
      - tests/payment-evidence-documents.test.mjs
      - supabase/migrations/20261111014500_payment_evidence_exclude_confirmed_transfers.sql
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/payment-evidence-exclude-transferred-out-20261111
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Bust lazy payment-evidence module cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app.js")
          source = path.read_text()
          old = 'payment-evidence-documents.js?v=20261110.6'
          new = 'payment-evidence-documents.js?v=20261111.1'
          if old in source:
              if source.count(old) != 1:
                  raise SystemExit("Expected exactly one payment-evidence module import")
              source = source.replace(old, new)
              path.write_text(source)
          elif new not in source:
              raise SystemExit("Could not locate the payment-evidence lazy import")
          PY
      - name: Validate source, bundle, and regressions
        run: |
          node --check modules/payment-evidence-documents.js
          npm run verify
          git diff --check
      - name: Commit refreshed source and production bundle
        run: |
          if git diff --quiet -- app.js app.min.js; then
            echo "Application source and bundle are already up to date"
          else
            git config user.name "BNK School OS Build"
            git config user.email "bnk-school-os-build@users.noreply.github.com"
            git add app.js app.min.js
            git commit -m "build: bump payment evidence module cache and refresh bundle"
            git push origin HEAD:fix/payment-evidence-exclude-transferred-out-20261111
          fi
