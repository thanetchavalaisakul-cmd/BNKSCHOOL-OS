name: BNK Preschool Admin Duty Release
on:
  push:
    branches: [main]
    paths:
      - '.github/preschool-duty-release-data.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify preschool duty change
        run: |
          python3 - <<'PY'
          import pathlib,base64,gzip
          encoded=pathlib.Path('.github/preschool-duty-release-data.txt').read_text().strip()
          pathlib.Path('/tmp/preschool-duty-fix.patch').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=True)))
          PY
          git apply --check /tmp/preschool-duty-fix.patch
          git apply --index /tmp/preschool-duty-fix.patch
          node --check app.js
          node --check staff-duty-label.js
          node --test tests/staff-duty-label.test.mjs tests/performance-regression.test.mjs tests/timetable-constraints.test.mjs tests/timetable-condition-periods.test.mjs tests/timetable-demo.test.mjs
          git diff --cached --check
      - name: Publish
        run: |
          git config user.name "BNK School OS Release Bot"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "fix: use preschool weekly units in admin teacher-duty summary"
          git push origin HEAD:main
