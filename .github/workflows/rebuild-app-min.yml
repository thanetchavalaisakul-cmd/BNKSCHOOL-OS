name: Rebuild minified app on source updates
on:
  push:
    branches: [main]
    paths:
      - app.js
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build minified bundle
        run: |
          npm ci
          npm run build:app
          node --check app.min.js
      - name: Commit reproducible compiled artifact
        run: |
          if ! git diff --quiet -- app.min.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.min.js
            git commit -m "build: regenerate minified app from notification center source"
            git push
          fi
