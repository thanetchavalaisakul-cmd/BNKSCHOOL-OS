name: Apply verified paper approval and signature statuses v42
on:
  push:
    branches: [main]
    paths: [.github/workflows/paper-approval-v42-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: "github.event.head_commit.message == 'ci: apply verified paper approval v42'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 5
          persist-credentials: true
      - name: Verify source and apply change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~4)" = "e8fa77368f3b18e36845480c6b4858dc00021b73"
          cat .tmp/bnk-v42.part-*.b64 | base64 --decode | gzip --decompress > /tmp/bnk-v42.patch
          echo "070da78b50be0eeee45a346daf05f19c172ae4e918e40e50a24a8508bcf0bac7  /tmp/bnk-v42.patch" | sha256sum --check
          git apply --check /tmp/bnk-v42.patch
          git apply /tmp/bnk-v42.patch
      - name: Run full regression tests and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          git diff --check
      - name: Publish tested changes and clean up
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/paper-approval-v42-once.yml .tmp/bnk-v42.part-*.b64
          git add app.js app.min.js index.html supabase-budget-paper-approval-20261030.sql
          git add tests/budget-parallel-signing.test.mjs tests/signature-adapters.test.mjs tests/paper-approval-status.test.mjs
          git add -u .github/workflows/paper-approval-v42-once.yml .tmp
          git diff --cached --check
          git -c user.name="BNK School OS CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix: approve on paper with separate physical signature status"
          git push origin HEAD:main
