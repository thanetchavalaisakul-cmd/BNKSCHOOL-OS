name: BNK academic registration approval visibility regression
on:
  push:
    branches: [fix/academic-registration-approvals-20261102]
permissions:
  contents: write
jobs:
  test-and-build:
    if: "!contains(github.event.head_commit.message, '[registration-built]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped registration UI patch
        run: python3 changes/registration-approvals-ui-20261102.py
      - name: Full regression suite
        run: |
          npm ci --no-audit --no-fund
          npm run verify
          git diff --check
      - name: Commit verified UI and minified bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.min.js index.html tests/certificate-preparer-schoolwide.test.mjs
          git commit -m "fix: visible pending registration approvals across roles and terms [registration-built]"
          git push origin HEAD:fix/academic-registration-approvals-20261102
