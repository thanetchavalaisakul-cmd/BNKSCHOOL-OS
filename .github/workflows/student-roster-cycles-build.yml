name: BNK student roster cycle validation and bundle build

on:
  push:
    branches:
      - feature/student-roster-cycles-20261110
    paths:
      - .github/workflows/student-roster-cycles-build.yml
      - app.js
      - index.html
      - modules/general-student-roster.js
      - tests/student-roster-cycles-20261110.test.mjs
      - tests/general-student-roster.test.mjs
      - tests/general-student-roster-transfer-all-periods-20261103.test.mjs
      - supabase/migrations/20261110153548_student_roster_cycles_and_lifecycle.sql
      - supabase/migrations/20261110154108_student_roster_status_guard_and_idempotency.sql
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout student roster feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/student-roster-cycles-20261110
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source, optimized bundle and regression tests
        run: |
          node --check app.js
          node --check modules/general-student-roster.js
          npm run verify
          git diff --check
      - name: Commit refreshed production bundle to feature branch
        run: |
          if git diff --quiet -- app.min.js; then
            echo "app.min.js is already up to date"
          else
            git config user.name "BNK School OS Build"
            git config user.email "bnk-school-os-build@users.noreply.github.com"
            git add app.min.js
            git commit -m "build: refresh student roster cycle app bundle"
            git push origin HEAD:feature/student-roster-cycles-20261110
          fi
