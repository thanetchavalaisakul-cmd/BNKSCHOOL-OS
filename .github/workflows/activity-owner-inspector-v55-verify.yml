name: BNK activity-owner acceptance committee exception
on:
  push:
    branches: [fix/activity-owner-inspector-20261030]
permissions:
  contents: write
concurrency:
  group: bnk-activity-owner-inspector
  cancel-in-progress: false
jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[owner-inspector-built]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped activity-owner inspector selection patch
        run: |
          gzip -dc changes/budget-activity-owner-inspector-v55.patch.gz > /tmp/bnk-owner-inspector.patch
          git apply --check /tmp/bnk-owner-inspector.patch
          git apply /tmp/bnk-owner-inspector.patch
      - name: Build app and run regression suite
        run: |
          npm ci --no-audit --no-fund
          npm run verify
          git diff --check
      - name: Commit verified UI and minified bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.min.js index.html
          git commit -m "fix: allow activity owner requester as inspector 1-3 [owner-inspector-built]"
          git push origin HEAD:fix/activity-owner-inspector-20261030
