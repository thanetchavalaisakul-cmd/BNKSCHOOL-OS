name: Apply and test official duty feature
on:
  push:
    branches: [feature/official-duty-leave-substitute-20261123]
    paths: ['.github/workflows/official-duty-build.yml', 'changes/official-duty-apply-20261123.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/official-duty-leave-substitute-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Safely modify existing leave UI
        run: python3 changes/official-duty-apply-20261123.py
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Full regression suite and optimized bundle
        run: npm run verify
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified application changes on feature branch
        run: |
          git config user.name "BNK Feature Build"
          git config user.email "bnk-feature-build@users.noreply.github.com"
          git add app.js app.min.js index.html
          git commit -m "feat: add official duty to existing leave and substitute workflow"
          git push origin HEAD:feature/official-duty-leave-substitute-20261123
