name: Apply BNK timetable validated patch
on:
  push:
    branches: [main]
    paths:
      - '.github/timetable-release-data.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore patch
        run: |
          python3 - <<'PY'
          import base64,gzip,pathlib
          data=pathlib.Path('.github/timetable-release-data.txt').read_text().strip()
          pathlib.Path('/tmp/changes.patch').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/changes.patch
          git apply --index /tmp/changes.patch
      - name: Verify code
        run: |
          node --check app.js
          node --check timetable-constraints.js
          node --test tests/performance-regression.test.mjs tests/timetable-constraints.test.mjs tests/timetable-condition-periods.test.mjs tests/timetable-demo.test.mjs
      - name: Save change
        run: |
          git config user.name "BNK Release"
          git config user.email "bnk-release@users.noreply.github.com"
          git commit -m "feat: finalize timetable workflows and preschool status"
          git push origin HEAD:main
