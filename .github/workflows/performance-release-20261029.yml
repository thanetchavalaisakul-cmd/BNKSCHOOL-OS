name: BNK School OS Performance Release
on:
  push:
    branches: [main]
    paths:
      - '.github/performance-release-data.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact reviewed changes
        run: |
          python3 - <<'PY'
          import pathlib,base64,gzip
          encoded=pathlib.Path('.github/performance-release-data.txt').read_text().strip()
          pathlib.Path('/tmp/bnk-performance.patch').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=True)))
          PY
          git apply --check /tmp/bnk-performance.patch
          git apply --index /tmp/bnk-performance.patch
      - name: Syntax and regression tests
        run: |
          node --check app.js
          node --check staff-duty-label.js
          node --check timetable-constraints.js
          node --test tests/*.test.mjs
          git diff --cached --check
      - name: Commit verified release
        run: |
          git config user.name "BNK School OS Release"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "perf: faster module navigation and timetable query loading"
          git push origin HEAD:main
