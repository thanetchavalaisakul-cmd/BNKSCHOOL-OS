name: Apply verified central signature compliance v40
on:
  push:
    branches: [main]
    paths: [.github/workflows/central-signature-v40-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: "github.event.head_commit.message == 'ci: apply verified central signature compliance v40'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 5
          persist-credentials: true
      - name: Validate version and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~4)" = "78b20456756d42a8536e7699b4ddff3ef90e9ed7"
          cat .tmp/bnk-central-sig.part-*.b64 | base64 --decode | gzip --decompress >/tmp/bnk-central-sig.patch
          echo "e94bc6296840c1657bf69a6385914ee684bce3e0cdcac34718f6a80f3dd14b9f  /tmp/bnk-central-sig.patch" | sha256sum --check
          git apply --check /tmp/bnk-central-sig.patch
          git apply /tmp/bnk-central-sig.patch
      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          git diff --check
      - name: Publish standard and remove one-time resources
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/central-signature-v40-once.yml .tmp/bnk-central-sig.part-*.b64
          git add app.js app.min.js index.html signature-compliance.js signature-standard.js supabase-signature-compliance-20261030.sql tests/signature-standard.test.mjs
          git add -u .github/workflows/central-signature-v40-once.yml .tmp
          git diff --cached --check
          git -c user.name="BNK School OS CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: central signature compliance audit and future onboarding"
          git push origin HEAD:main
