name: BNK School OS Optimized Bundle Release
on:
  push:
    branches: [main]
    paths:
      - '.github/phase5-optimized-release-data.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed build changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          payload=Path('.github/phase5-optimized-release-data.txt').read_text().strip()
          Path('/tmp/phase5-optimized-source.patch').write_bytes(gzip.decompress(base64.b64decode(payload,validate=True)))
          PY
          git apply --check --exclude='.github/workflows/build-optimized-app.yml' /tmp/phase5-optimized-source.patch
          git apply --index --exclude='.github/workflows/build-optimized-app.yml' /tmp/phase5-optimized-source.patch
      - name: Install reproducible pinned compiler
        run: npm ci --no-audit --no-fund
      - name: Build and run all regression checks
        run: |
          npm run verify
          git diff --cached --check
      - name: Commit and publish optimized site
        run: |
          git config user.name "BNK School OS Release"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git add app.min.js
          git commit -m "perf: serve minified application with automated rebuilds"
          git push origin HEAD:main
