name: BNK OS regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Local regression tests
        run: node --test tests/performance-regression.test.mjs
      - name: Leave weekday and school-open weekend checks
        run: node --test tests/leave-half-day-weekday-quota-20261111.test.mjs tests/leave-weekend-school-days-20261111.test.mjs
      - name: Academic certificate registry checks
        run: |
          node --check modules/academic-certificate-registry.js
          node --test tests/academic-certificate-registry-20261105.test.mjs
