name: BNK Timetable Conditions Refinement
on:
  push:
    branches: [main]
    paths:
      - .github/timetable-refinement.patch.gz.b64
permissions:
  contents: write
concurrency:
  group: bnk-timetable-refinement
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply tested timetable filtering patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,gzip
          source=pathlib.Path('.github/timetable-refinement.patch.gz.b64').read_text().strip()
          pathlib.Path('/tmp/timetable-refinement.patch').write_bytes(gzip.decompress(base64.b64decode(source,validate=True)))
          PY
          git apply --check /tmp/timetable-refinement.patch
          git apply --index /tmp/timetable-refinement.patch
      - name: Verify source and regression checks
        run: |
          node --check app.js
          node --check timetable-constraints.js
          node --check timetable-solver.js
          node --test tests/performance-regression.test.mjs tests/timetable-constraints.test.mjs tests/timetable-condition-periods.test.mjs
          git diff --cached --check
      - name: Commit changes to main
        run: |
          git config user.name "BNK School OS Release Bot"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "feat: filter timetable locks by stage and room with configured periods"
          git push origin HEAD:main
