name: BNK Demo Timetable Assignment Release
on:
  push:
    branches: [main]
    paths:
      - .github/demo-scheduling-release.patch.gz.b64
permissions:
  contents: write
concurrency:
  group: bnk-demo-scheduling-release
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated demo teacher schedule update
        run: |
          python3 - <<'PY'
          import gzip,base64,pathlib
          source=pathlib.Path('.github/demo-scheduling-release.patch.gz.b64').read_text().strip()
          pathlib.Path('/tmp/demo-scheduling.patch').write_bytes(gzip.decompress(base64.b64decode(source,validate=True)))
          PY
          git apply --check /tmp/demo-scheduling.patch
          git apply --index /tmp/demo-scheduling.patch
      - name: Verify syntax and timetable regression
        run: |
          node --check app.js
          node --check timetable-demo.js
          node --check timetable-constraints.js
          node --test tests/performance-regression.test.mjs tests/timetable-constraints.test.mjs tests/timetable-condition-periods.test.mjs tests/timetable-demo.test.mjs
          git diff --cached --check
      - name: Publish tested demo timetable
        run: |
          git config user.name "BNK School OS Release Bot"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "feat: independently assign and schedule three demo teachers"
          git push origin HEAD:main
