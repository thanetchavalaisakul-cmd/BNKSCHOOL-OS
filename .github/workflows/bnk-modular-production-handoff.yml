name: BNK one-time Git-linked Vercel production handoff
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release-handoff:
    if: "contains(github.event.head_commit.message, '[bnk-release-handoff]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Trigger one real Git push of verified modular bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          text=p.read_text()
          assert 'app.min.js?v=5.12.9.58' in text, "Refuse wrong release version"
          marker='  <!-- BNK School OS modular release via Git integration -->\n'
          assert '</head>' in text
          if marker not in text:
              text=text.replace('</head>',marker+'</head>',1)
              p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "release: Git-integrated modular Production build [bnk-release-complete]"
          git push origin HEAD:main
