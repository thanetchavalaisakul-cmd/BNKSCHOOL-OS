name: BNK student suspension roster and letters build
on:
  push:
    branches: [feature/student-suspension-pages-pdf-excel-20261119]
    paths:
      - 'app.js'
      - 'modules/student-dialogs.js'
      - 'tests/student-suspension-pages-20261119.test.mjs'
      - 'index.html'
      - '.github/workflows/student-suspension-pages-build.yml'
permissions:
  contents: write
concurrency:
  group: bnk-student-suspension-pages-20261119
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/student-suspension-pages-pdf-excel-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify syntax, exports, and regression tests
        run: |
          node --check app.js
          node --check modules/student-dialogs.js
          npm run verify
          git diff --check
      - name: Commit validated optimized bundle
        run: |
          git add app.min.js
          if ! git diff --cached --quiet; then
            git config user.name "BNK School OS Build"
            git config user.email "bnk-school-os-build@users.noreply.github.com"
            git commit -m "build: compiled suspended roster and letter pages"
            git push origin HEAD:feature/student-suspension-pages-pdf-excel-20261119
          fi
