name: BNK core reliability and realtime change coalescing
on:
  push:
    branches: [fix/production-hardening-20261030]
permissions:
  contents: write
concurrency:
  group: bnk-production-hardening
  cancel-in-progress: false
jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[hardening-built]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Guardedly patch frontend
        run: python3 changes/production-hardening-20261030.py
      - name: Run build and complete regressions
        run: |
          npm ci --no-audit --no-fund
          npm run verify
          git diff --check
      - name: Commit verified source and optimized bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.min.js index.html
          git commit -m "perf: coalesce realtime reloads and paginate high-growth datasets [hardening-built]"
          git push origin HEAD:fix/production-hardening-20261030
