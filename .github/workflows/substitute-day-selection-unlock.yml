name: BNK OS all-day selection unlock verification
on:
  push:
    branches: [fix/unlock-full-day-substitute-20261030]
permissions:
  contents: write
concurrency:
  group: bnk-os-day-unlock
  cancel-in-progress: false
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[day-unlock-built]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Apply scoped whole-day UI patch
        run: python3 changes/unlock-substitute-day-20261030.py
      - name: Install locked build dependencies
        run: npm ci
      - name: Run full regression tests and build
        run: npm run verify
      - name: Commit verified frontend and minified bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.min.js
          git commit -m "fix: allow any active teacher for whole-day substitute [day-unlock-built]"
          git push origin HEAD:fix/unlock-full-day-substitute-20261030
