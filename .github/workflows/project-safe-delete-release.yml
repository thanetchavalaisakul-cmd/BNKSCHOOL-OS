name: BNK Safe Project Deletion Release
on:
  push:
    branches: [main]
    paths:
      - '.github/project-safe-delete-release.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed project deletion code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64
          encoded=Path('.github/project-safe-delete-release.txt').read_text().strip()
          Path('/tmp/project-safe-delete.patch').write_bytes(gzip.decompress(base64.b64decode(encoded,validate=True)))
          PY
          git apply --check /tmp/project-safe-delete.patch
          git apply --index /tmp/project-safe-delete.patch
      - name: Verify project and system regression
        run: |
          node --check app.js
          node --test tests/*.test.mjs
          git diff --cached --check
      - name: Publish tested fix
        run: |
          git config user.name "BNK School OS Release"
          git config user.email "bnk-school-os@users.noreply.github.com"
          git commit -m "fix: safely delete projects linked only to archived procurement"
          git push origin HEAD:main
